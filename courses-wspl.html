  /* ---------- « Et si ? » + calcul inverse (même contexte de course) ---------- */
  function disciplineCourses(d) { return courses().filter((c) => c.disciplines.includes(d) || !c.disciplines.length); }

  function setCtxFromCourse(courseId) {
    const c = ui.sim.ctx, ev = courseId ? eventById(courseId) : null;
    c.courseId = ev ? ev.id : '';
    if (ev) {
      const dpl = E.defaultPL(ev);
      c.date = ev.fin; c.niveau = dpl.niveau; c.PL = dpl.PL;
    }
    c.place = Math.min(c.place, c.F);
  }

  function renderWhatIfForm() {
    const d = ui.sim.discipline, c = ui.sim.ctx, a = athlete();
    const ev = c.courseId ? eventById(c.courseId) : null;
    const range = E.plRange(c.niveau);
    const lvHyp = ev ? E.levelForEvent(ev).hypothese : false;
    $('#sim-whatif').innerHTML =
      '<h2>Et si ? · ' + d + '</h2>' +
      '<label class="field">Course<select data-ctx="courseId"><option value="">Course libre (hors calendrier)</option>' +
        disciplineCourses(d).map((x) => '<option value="' + esc(x.id) + '"' + (x.id === c.courseId ? ' selected' : '') + '>' + esc(fmtRange(x.debut, x.fin) + ' · ' + x.titre) + (x.aConfirmer ? ' (à confirmer)' : '') + '</option>').join('') +
      '</select></label>' +
      '<div class="grid2"><label class="field">Date (fin de course)<input type="date" data-ctx="date" value="' + esc(c.date) + '"' + (ev ? ' readonly' : '') + '></label>' +
        '<label class="field">Niveau WSPL<select data-ctx="niveau"' + (ev && ev.niveauWSPL ? ' disabled' : '') + '>' +
          E.LEVEL_NAMES.slice().reverse().map((n) => '<option value="' + n + '"' + (n === c.niveau ? ' selected' : '') + '>' + '★'.repeat(E.LEVELS[n].etoiles) + ' ' + n + '</option>').join('') + '</select></label></div>' +
      (lvHyp ? '<div class="banner small"><b>Hypothèse :</b> niveau WSPL non précisé pour cette course — ' + esc(c.niveau) + ' supposé d\'après le circuit.</div>' : '') +
      '<label class="field">Points Level (PL) : <b class="num" id="plVal">' + c.PL + '</b> <span class="tiny">(' + range.min + '–' + range.max + ')</span>' +
        '<input type="range" data-ctx="PL" min="' + range.min + '" max="' + range.max + '" step="10" value="' + c.PL + '"></label>' +
      (c.niveau === 'Elite' ? '<details><summary class="small">Calculer le PL Elite depuis la R-Value</summary>' +
        '<div class="grid2" style="margin-top:8px"><label class="field">R-Value (' + (a.genre === 'H' ? 'top 8 H' : 'top 5 F') + ')<input type="number" step="0.01" min="0" inputmode="decimal" data-ctx="rValue" value="' + esc(c.rValue) + '"></label>' +
        '<div><div class="small muted" id="rvOut" style="margin-top:4px">—</div><button class="btn sm" data-action="apply-rvalue" style="margin-top:6px">Appliquer</button></div></div>' +
        '<p class="tiny muted">PL 1000 : H 4,5–6 / F 3–4,3 · 900 : H 6,01–9,3 / F 4,31–7 · 800 : H 9,31–16 / F 7,01–12 · 700 : H 16,01–25 / F 12,01–19. Au-delà : P-Value (non modélisée).</p></details>' : '') +
      '<div class="grid2"><label class="field">Classés (F, ' + (a.genre === 'H' ? 'hommes' : 'femmes') + ')<input type="number" min="1" max="200" inputmode="numeric" data-ctx="F" value="' + c.F + '"></label>' +
        '<label class="field">Place visée (R)<input type="number" min="1" inputmode="numeric" data-ctx="place" value="' + c.place + '"></label></div>' +
      '<div id="whatifOut"></div>' +
      '<hr style="border:0;border-top:1px solid var(--border);margin:14px 0">' +
      '<h3>Calcul inverse</h3>' +
      '<div class="grid2"><label class="field">Objectif<select data-ctx="target">' +
        [['WC', 'Seuil WC (' + thLabel(th(d).WC, 'WC') + ')'], ['EC', 'Seuil EC (' + thLabel(th(d).EC, 'EC') + ')'], ['custom', 'Personnalisé']].map(([v, l]) => '<option value="' + v + '"' + (c.target === v ? ' selected' : '') + '>' + l + '</option>').join('') +
      '</select></label>' +
      (c.target === 'custom' ? '<label class="field">Score visé<input type="number" min="0" inputmode="decimal" data-ctx="custom" value="' + c.custom + '"></label>' : '<div></div>') + '</div>' +
      '<div id="inverseOut"></div>';
    renderWhatIfOut();
  }

  function renderWhatIfOut() {
    const d = ui.sim.discipline, c = ui.sim.ctx, a = athlete();
    const out = $('#whatifOut'), inv = $('#inverseOut');
    if (!out) return;
    const F = parseInt(c.F, 10), R = parseInt(c.place, 10), PL = Number(c.PL);
    const ev = c.courseId ? eventById(c.courseId) : null;
    const label = ev ? ev.titre : 'Course libre';
    // R-Value
    const rv = $('#rvOut');
    if (rv) {
      const v = parseFloat(String(c.rValue).replace(',', '.'));
      if (v > 0) { const r = E.plFromRValue(v, a.genre); rv.textContent = r.PL ? 'PL calculé : ' + r.PL : r.message; }
      else rv.textContent = 'Saisir une R-Value';
    }
    if (!(F >= 1) || !(R >= 1) || R > F || !/^\d{4}-\d{2}-\d{2}$/.test(c.date)) {
      out.innerHTML = '<p class="small test-ko">Vérifier la saisie : 1 ≤ place ≤ F, date valide.</p>'; inv.innerHTML = ''; return;
    }
    const w = E.whatIf(athleteResults(), { date: c.date, place: R, F, PL, course: label }, d, engineOpts());
    const dcls = w.delta > 0 ? 'delta-pos' : w.delta < 0 ? 'delta-neg' : '';
    out.innerHTML =
      '<div class="kpis"><div class="kpi"><div class="v">' + pts(w.points) + '</div><div class="l">pts pour ' + R + 'e/' + F + '</div></div>' +
      '<div class="kpi"><div class="v">' + pts(w.after.score) + '</div><div class="l">nouveau score</div></div>' +
      '<div class="kpi"><div class="v ' + dcls + '">' + (w.delta > 0 ? '+' : '') + pts(w.delta) + '</div><div class="l">vs ' + pts(w.before.score) + ' au ' + fmtDate(c.date) + '</div></div></div>' +
      '<div class="row" style="margin-top:10px">' + statusChip(w.statutApres) +
        w.franchissements.map((f) => '<span class="chip ok">Seuil ' + f.seuil + ' franchi (' + f.min + ')</span>').join('') +
        (!w.dansTop3 ? '<span class="chip">hors top 3 : aucun effet</span>' : '') + '</div>' +
      '<div class="small" style="margin-top:10px"><b>Nouveau top 3</b><ol style="margin:4px 0 0;padding-left:20px">' +
        w.after.top.map((r) => '<li>' + (r.hypothetique ? '<b>' : '') + pts(r.points) + ' — ' + esc(r.course || '') + ' (' + fmtDate(r.date) + ')' + (r.hypothetique ? ' · hypothèse</b>' : '') + '</li>').join('') +
      '</ol></div>' +
      '<p class="tiny muted">Score évalué à la date de la course : les résultats sortis de la fenêtre de 52 semaines à cette date ne comptent plus.' +
        (w.after.complete ? ' Moyenne complétée par 0 (moins de 3 résultats).' : '') + '</p>';

    // Calcul inverse
    const t = th(d);
    const target = c.target === 'custom' ? Number(c.custom) : t[c.target];
    if (target === null || target === undefined) { inv.innerHTML = '<p class="small muted">Pas de seuil ' + c.target + ' dans cette discipline.</p>'; return; }
    if (target === 0) { inv.innerHTML = '<p class="small muted">Seuil ' + c.target + ' : aucun minimum — accès sans condition de points WSPL.</p>'; return; }
    const x = E.minPlaceForTarget(athleteResults(), { date: c.date, F, PL, course: label }, d, target, engineOpts());
    inv.innerHTML = x.dejaAtteint
      ? '<div class="banner"><b>Déjà atteint</b> : ' + pts(x.scoreAvant) + ' ≥ ' + target + ' au ' + fmtDate(c.date) + ', quelle que soit la place.</div>'
      : x.atteignable
        ? '<div class="banner"><b>Place minimale : ' + x.place + 'e / ' + F + '</b> (' + pts(x.points) + ' pts) → score ' + pts(x.score) + ' ≥ ' + target + '.</div>'
        : '<div class="banner warn"><b>Inatteignable sur cette course seule</b> : même une victoire donne ' + pts(x.scoreEnPremier) + ' < ' + target + ' (PL ' + PL + ').</div>';
  }

  /* ---------- Expiration ---------- */
  function renderExpiry() {
    const d = ui.sim.discipline;
    const upcoming = courses().filter((c) => (c.circuit === 'WC' || c.circuit === 'WCH') && c.disciplines.includes(d) && c.debut > ui.sim.refDate).slice(0, 4);
    if (!ui.sim.expTarget || ui.sim.expTarget <= ui.sim.refDate) ui.sim.expTarget = upcoming[0] ? upcoming[0].debut : E.addDays(ui.sim.refDate, 60);
    const x = E.expiringResults(athleteResults(), d, ui.sim.refDate, ui.sim.expTarget, engineOpts());
    const dcls = x.delta < 0 ? 'delta-neg' : '';
    $('#sim-expiry').innerHTML =
      '<h2>Expiration · ' + d + '</h2>' +
      '<p class="small muted">Résultats qui sortent de la fenêtre de 52 semaines entre la date de référence et une date cible (ex. inscription à une WC).</p>' +
      '<label class="field">Date cible<input type="date" data-sim="expTarget" value="' + esc(ui.sim.expTarget) + '"></label>' +
      (upcoming.length ? '<div class="row">' + upcoming.map((c) => '<button class="chip" data-action="exp-date" data-date="' + c.debut + '" aria-pressed="' + (ui.sim.expTarget === c.debut) + '">' + esc(c.lieu) + ' · ' + fmtDate(c.debut) + '</button>').join('') + '</div>' : '') +
      '<div class="kpis"><div class="kpi"><div class="v">' + pts(x.scoreAvant) + '</div><div class="l">au ' + fmtDate(x.fromDate) + '</div></div>' +
      '<div class="kpi"><div class="v">' + pts(x.scoreCible) + '</div><div class="l">au ' + fmtDate(x.targetDate) + '</div></div>' +
      '<div class="kpi"><div class="v ' + dcls + '">' + (x.delta > 0 ? '+' : '') + pts(x.delta) + '</div><div class="l">effet</div></div></div>' +
      (x.expiring.length
        ? '<div class="banner warn"><b>⚠ ' + x.expiring.length + ' résultat(s) expirent</b><ul style="margin:6px 0 0;padding-left:18px">' +
          x.expiring.map((r) => '<li>' + esc(r.course) + ' — ' + pts(r.points) + ' pts, sort le ' + fmtDate(r.sortLe) + (r.dansTop3 ? ' <b>(top 3)</b>' : '') + '</li>').join('') + '</ul></div>'
        : '<p class="small muted">Aucun résultat n\'expire d\'ici là.</p>') +
      '<p class="tiny muted">Sans nouveau résultat entre les deux dates.</p>';
  }

    const r = id ? state.results.find((x) => x.id === id) : null;
    const v = r || { date: ui.sim.refDate, course: '', discipline: ui.sim.discipline, place: 1, F: 20, PL: 400 };
    openSheet(sheetHead(r ? 'Modifier le résultat' : 'Nouveau résultat') +

      '<label class="field">Discipline<select name="discipline">' + E.DISCIPLINES.map((d) => '<option' + (d === v.discipline ? ' selected' : '') + '>' + d + '</option>').join('') + '</select></label></div>' +
      '<p class="small muted" style="margin:0">Résultat de ' + esc(athlete().nom) + '</p>' +
      '<label class="field">Course du calendrier (préremplit date, discipline et PL)<select name="fromCourse"><option value="">— Saisie libre —</option>' +
        courses().filter((c) => c.debut <= E.addDays(TODAY, 1)).slice().reverse().map((c) => '<option value="' + esc(c.id) + '">' + esc(fmtRange(c.debut, c.fin) + ' · ' + c.titre) + '</option>').join('') +

      '<div class="grid3"><label class="field">Place<input type="number" name="place" min="1" required inputmode="numeric" value="' + v.place + '"></label>' +
      '<label class="field">Classés (F)<input type="number" name="F" min="1" required inputmode="numeric" value="' + v.F + '"></label>' +
      '<label class="field">PL<input type="number" name="PL" min="100" max="1000" step="10" required inputmode="numeric" value="' + v.PL + '"></label></div>' +

      '<div class="row"><button class="btn primary" type="submit">Enregistrer</button>' +
      (r ? '<button class="btn danger" type="button" data-action="delete-result" data-id="' + esc(r.id) + '">Supprimer</button>' : '') +
      '<button class="btn ghost" type="button" data-action="close-sheet">Annuler</button></div></form>');
    updateResultPreview();
  }
  function readResultForm(form) {
    const fd = new FormData(form);
    return { date: fd.get('date'), discipline: fd.get('discipline'), course: (fd.get('course') || '').trim(),
      place: parseInt(fd.get('place'), 10), F: parseInt(fd.get('F'), 10), PL: Number(fd.get('PL')) };
  }
  function updateResultPreview() {
    const f = $('#resultForm'); if (!f) return;
    const v = readResultForm(f);
    try { $('#resPts').textContent = pts(E.pointsForPlace(v.place, v.F, v.PL)); $('#resErr').textContent = ''; }
    catch (e) { $('#resPts').textContent = '—'; $('#resErr').textContent = e.message; }
  }
  function submitResult(form) {
    const v = readResultForm(form);
    try { E.pointsForPlace(v.place, v.F, v.PL); E.dayNumber(v.date); } catch (e) { $('#resErr').textContent = e.message; return; }
    const id = form.dataset.id || uid('r');
    const rec = Object.assign({ id, athleteId: athlete().id }, v);
    const i = state.results.findIndex((r) => r.id === id);
    if (i >= 0) state.results[i] = Object.assign({}, state.results[i], rec, { exemple: state.results[i].exemple }); else state.results.push(rec);
    save.results(); closeSheet();
    ui.sim.discipline = v.discipline;
    renderSim(); toast('Résultat enregistré');
  }

  function openAthleteForm(edit) {
    const a = edit ? athlete() : null;
    openSheet(sheetHead(a ? 'Modifier l\'athlète' : 'Nouvel athlète') +
      '<form id="athleteForm" class="stack" data-id="' + esc(a ? a.id : '') + '">' +
      '<label class="field">Nom<input type="text" name="nom" required autocomplete="off" placeholder="Prénom Nom" value="' + esc(a ? a.nom : '') + '"></label>' +
      '<label class="field">Genre<select name="genre"><option value="H"' + (a && a.genre === 'H' ? ' selected' : '') + '>Homme</option><option value="F"' + (a && a.genre === 'F' ? ' selected' : '') + '>Femme</option></select></label>' +
      '<div class="row"><button class="btn primary" type="submit">Enregistrer</button>' +
      (a ? '<button class="btn danger" type="button" data-action="delete-athlete" data-id="' + esc(a.id) + '">Supprimer (et ses résultats)</button>' : '') + '</div></form>');
  }
  function submitAthlete(form) {
    const fd = new FormData(form);
    const nom = (fd.get('nom') || '').trim(); if (!nom) return;
    const id = form.dataset.id;
    if (id) { const a = state.athletes.find((x) => x.id === id); a.nom = nom; a.genre = fd.get('genre'); }
    else { const a = { id: uid('ath'), nom, genre: fd.get('genre') }; state.athletes.push(a); ui.sim.athleteId = a.id; toast(nom + ' ajouté'); }
    save.athletes(); closeSheet(); renderSim();
  }

  /* ---------- Import / export ---------- */
  function exportJSON() {
    const payload = { format: 'akse-coach.events', version: 1, exporte: new Date().toISOString(), saison: DATA.meta.saison, events: allEvents() };
    openExport('Export JSON des événements', 'akse-evenements-' + TODAY + '.json', JSON.stringify(payload, null, 2), 'application/json');
  }
  /** Export : le texte est affiché et copiable (fiable partout, y compris dans
   *  claude.ai où les téléchargements sont bloqués) ; le bouton Télécharger
   *  fonctionne quand le fichier est ouvert directement dans un navigateur. */
  let pendingExport = null;
  function openExport(title, filename, content, mime) {
    pendingExport = { filename, content, mime };
    openSheet(sheetHead(esc(title)) +
      '<p class="small muted">Copiez le contenu (puis collez-le dans Notes, un mail ou akse-coach), ou téléchargez le fichier si votre navigateur le permet.</p>' +
      '<textarea class="code" id="exportText" readonly>' + esc(content) + '</textarea>' +
      '<div class="row section"><button class="btn primary" data-action="copy-export">Copier</button>' +
      '<button class="btn" data-action="download-export">Télécharger ' + esc(filename.split('.').pop()) + '</button></div>');
  }
  /** Enregistrement d'un fichier : via la capacité « downloads » de claude.ai
   *  quand elle est disponible (extensions autorisées : json, txt…), sinon
   *  téléchargement classique du navigateur (fichier ouvert hors claude.ai). */
  const SAVE_EXT_OK = ['json', 'txt', 'csv', 'md'];
  let downloadsNs;
  async function saveFile(f) {
    const ext = f.filename.split('.').pop();
    if (downloadsNs === undefined) {
      try { downloadsNs = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; }
      catch (e) { downloadsNs = null; }
    }
    if (downloadsNs && SAVE_EXT_OK.includes(ext)) {
      try { await downloadsNs.save({ filename: f.filename, data: f.content }); toast('Fichier enregistré'); }
      catch (e) {
        const code = e && e.code;
        toast(code === 'declined' ? 'Enregistrement annulé' : code === 'rate_limited' ? 'Une demande est déjà ouverte, réessayez' : 'Enregistrement impossible ici : utilisez Copier');
      }
      return;
    }
    if (window.claude && !SAVE_EXT_OK.includes(ext)) { toast('Format .' + ext + ' non enregistrable dans claude.ai : utilisez Copier'); return; }
    download(f.filename, f.content, f.mime);
    toast('Si rien ne se passe, utilisez Copier');
  }
  function openImport() {
    openSheet(sheetHead('Importer des événements') +
      '<p class="small muted">Collez un JSON exporté (format { events: [...] } ou tableau), ou choisissez un fichier.</p>' +
      '<textarea class="code" id="importText" placeholder=\'{ "events": [ ... ] }\'></textarea>' +
      '<div class="row section"><button class="btn primary" data-action="import-paste">Importer le texte collé</button>' +
      '<button class="btn" data-action="import-file">Choisir un fichier</button></div>');
  }
  function importJSON(text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { toast('Fichier JSON illisible'); return; }
    const list = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.events) ? parsed.events : null;
    if (!list) { toast('Format attendu : { events: [...] } ou tableau'); return; }
    let ok = 0, ko = 0;
    const newCourses = (state.courses || DATA.courses).map((c) => Object.assign({}, c));
    let coursesTouched = false;
    for (const raw of list) {
      const ev = raw && E.validateEvent(E.normalizeEvent(raw)).length === 0 ? E.normalizeEvent(raw) : null;
      if (!ev) { ko++; continue; }
      const target = ev.type === 'stage' ? state.stages : newCourses;
      const i = target.findIndex((x) => x.id === ev.id);
      if (i >= 0) target[i] = ev; else target.push(ev);
      if (ev.type === 'course') coursesTouched = true;
      ok++;
    }
    if (coursesTouched) { state.courses = newCourses; save.courses(); }
    save.stages();
    toast(ok + ' événement(s) importé(s)' + (ko ? ', ' + ko + ' ignoré(s)' : ''));
    renderAll();
  }

  /* =================================================================
     Rendu global & actions (délégation d'événements)
     ================================================================= */
  function renderAll() {
    renderCalendar();
    if (ui.tab === 'sim') renderSim();
    if (ui.tab === 'settings') renderSettings();
  }
  function showTab(tab) {
    ui.tab = tab;
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    ['calendar', 'sim', 'settings'].forEach((t) => { $('#view-' + t).hidden = t !== tab; });
    if (tab === 'calendar') renderCalendar();
    if (tab === 'sim') renderSim();
    if (tab === 'settings') renderSettings();
    window.scrollTo(0, 0);
  }

  const actions = {
    'tab': (el, ev) => { ev.preventDefault(); showTab(el.dataset.tab); },
    'theme': () => { state.theme = state.theme === 'auto' ? 'dark' : state.theme === 'dark' ? 'light' : 'auto'; save.theme(); applyTheme(); },
    'close-sheet': () => closeSheet(),
    'cal-view': (el) => { ui.calView = el.dataset.v; renderCalendar(); },
    'month': (el) => {
      goMonth(Number(el.dataset.step));
    },
    'month-today': () => { ui.month = TODAY.slice(0, 7); ui.selectedDay = TODAY; renderCalendar(); },
    'select-day': (el) => { ui.selectedDay = ui.selectedDay === el.dataset.day ? null : el.dataset.day; renderCalendar(); },
    'clear-day': () => { ui.selectedDay = null; renderCalendar(); },
    'filter-disc': (el) => {
      const d = el.dataset.d, f = ui.filters.disciplines;
      ui.filters.disciplines = f.includes(d) ? f.filter((x) => x !== d) : f.concat(d);
      renderCalendar();
    },
    'open-event': (el) => openEvent(el.dataset.id),
    'new-stage': () => openEventForm(null, 'stage'),
    'new-course': () => openEventForm(null, 'course'),
    'edit-event': (el) => openEventForm(el.dataset.id),
    'delete-event': (el) => {
      const ev = eventById(el.dataset.id); if (!ev) return;
      askConfirm('Supprimer « ' + ev.titre + ' » ?', () => {
        if (ev.type === 'stage') { state.stages = state.stages.filter((s) => s.id !== ev.id); save.stages(); }
        else { state.courses = courses().filter((c) => c.id !== ev.id); save.courses(); }
        closeSheet(); renderCalendar(); toast(ev.type === 'stage' ? 'Stage supprimé' : 'Course supprimée');
      });
    },
    'simulate-here': (el) => {
      const ev = eventById(el.dataset.id); if (!ev) return;
      if (el.dataset.d) ui.sim.discipline = el.dataset.d;
      setCtxFromCourse(ev.id);
      closeSheet(); showTab('sim');
      const w = $('#sim-whatif'); if (w) w.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    'pick-disc': (el) => {
      ui.sim.discipline = el.dataset.d;
      const cur = ui.sim.ctx.courseId && eventById(ui.sim.ctx.courseId);
      if (cur && cur.disciplines.length && !cur.disciplines.includes(ui.sim.discipline)) ui.sim.ctx.courseId = '';
      ui.sim.expTarget = null;
      renderSim();
    },
    'new-result': () => openResultForm(null),
    'edit-result': (el) => openResultForm(el.dataset.id),
    'delete-result': (el) => {
      const id = el.dataset.id;
      askConfirm('Supprimer ce résultat ?', () => { state.results = state.results.filter((r) => r.id !== id); save.results(); closeSheet(); renderSim(); toast('Résultat supprimé'); });
    },
    'new-athlete': () => openAthleteForm(false),
    'edit-athlete': () => openAthleteForm(true),
    'delete-athlete': (el) => {
      const id = el.dataset.id;
      askConfirm('Supprimer cet athlète et tous ses résultats ?', () => {
      state.athletes = state.athletes.filter((a) => a.id !== id);
      state.results = state.results.filter((r) => r.athleteId !== id);
      state.stages.forEach((s) => { s.athletes = s.athletes.filter((x) => x !== id); });
      ui.sim.athleteId = state.athletes[0] ? state.athletes[0].id : null;
      save.athletes(); save.results(); save.stages(); closeSheet(); renderSim(); toast('Athlète supprimé');
      });
    },
    'apply-rvalue': (el, ev) => {
      ev.preventDefault();
      const v = parseFloat(String(ui.sim.ctx.rValue).replace(',', '.'));
      if (!(v > 0)) { toast('Saisir une R-Value'); return; }
      const r = E.plFromRValue(v, athlete().genre);
      if (!r.PL) { toast(r.message); return; }
      ui.sim.ctx.PL = E.clampPL(r.PL, ui.sim.ctx.niveau); renderWhatIfForm(); toast('PL ' + ui.sim.ctx.PL + ' appliqué');
    },
    'exp-date': (el) => { ui.sim.expTarget = el.dataset.date; renderExpiry(); },
    'reset-thresholds': () => { state.settings.thresholds = clone(DATA.seuils); save.settings(); renderSettings(); toast('Seuils rétablis'); },
    'export-json': () => exportJSON(),
    'import-json': () => openImport(),
    'import-file': () => $('#importFile').click(),
    'import-paste': () => { const t = $('#importText').value.trim(); if (!t) { toast('Collez d\'abord un JSON'); return; } closeSheet(); importJSON(t); },
    'copy-export': () => {
      const ta = $('#exportText');
      const fallback = () => { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); toast('Texte sélectionné : utilisez Copier du menu'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Copié dans le presse-papiers'), fallback); } catch (e) { fallback(); }
    },
    'download-export': () => { if (pendingExport) saveFile(pendingExport); },
    'export-ics': () => {
      const evs = filteredEvents();
      openExport('Export .ics (' + evs.length + ' événements, filtres du calendrier appliqués)', 'akse-calendrier-' + TODAY + '.ics',
        E.toICS(evs, { now: new Date().toISOString(), calName: 'ak.se · Courses & stages ' + DATA.meta.saison }), 'text/calendar');
    },
    'reset-courses': () => askConfirm('Revenir au calendrier des courses d\'origine ? Les courses importées seront remplacées.', () => {
      state.courses = null; store.remove('courses'); closeSheet(); renderAll(); renderSettings(); toast('Calendrier des courses rétabli');
    }, 'Rétablir'),
    'confirm-yes': () => { const fn = pendingConfirm; pendingConfirm = null; if (fn) fn(); },
    'reset-examples': () => {
      const exIds = DATA.exemple.athletes.map((a) => a.id);
      state.athletes = state.athletes.filter((a) => !exIds.includes(a.id)).concat(clone(DATA.exemple.athletes));
      state.results = state.results.filter((r) => !r.exemple).concat(clone(DATA.exemple.resultats));
      save.athletes(); save.results(); toast('Exemples rechargés');
    },
    'clear-examples': () => {
      askConfirm('Supprimer les athlètes et résultats d\'EXEMPLE ?', () => {
      state.athletes = state.athletes.filter((a) => !a.exemple);
      state.results = state.results.filter((r) => !r.exemple);
      ui.sim.athleteId = state.athletes[0] ? state.athletes[0].id : null;
      save.athletes(); save.results(); closeSheet(); toast('Exemples supprimés');
      });
    }
  };

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) fn(el, ev);
  });
  // Glissement horizontal sur la grille du mois → mois précédent / suivant.
  let touchStart = null;
  document.addEventListener('touchstart', (ev) => {
    touchStart = ev.target.closest && ev.target.closest('.cal') && ev.touches.length === 1 ? { x: ev.touches[0].clientX, y: ev.touches[0].clientY } : null;
  }, { passive: true });
  document.addEventListener('touchend', (ev) => {
    if (!touchStart) return;
    const t = ev.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) goMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
  // Clic sur le fond de la modale → fermeture.
  sheet().addEventListener('click', (ev) => { if (ev.target === sheet()) closeSheet(); });

  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = ev.target;
    if (f.id === 'eventForm') submitEvent(f);
    if (f.id === 'resultForm') submitResult(f);
    if (f.id === 'athleteForm') submitAthlete(f);
  });

  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.closest('#resultForm')) { updateResultPreview(); return; }
    if (el.dataset.ctx) {
      const k = el.dataset.ctx, c = ui.sim.ctx;
      if (k === 'PL') { c.PL = Number(el.value); $('#plVal').textContent = c.PL; }
      else if (k === 'F' || k === 'place') c[k] = el.value;
      else if (k === 'rValue' || k === 'custom') c[k] = el.value;
      else return; // selects / date : gérés sur 'change'
      renderWhatIfOut();
    }
  });

  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.name === 'fromCourse' && el.closest('#resultForm')) {
      const c = eventById(el.value), f = el.form;
      if (c) {
        // Course en cours : on date le résultat d'aujourd'hui pour qu'il compte tout de suite.
        f.elements.date.value = c.fin > TODAY ? TODAY : c.fin; f.elements.course.value = c.titre;
        if (c.disciplines.length && !c.disciplines.includes(f.elements.discipline.value)) f.elements.discipline.value = c.disciplines[0];
        f.elements.PL.value = E.defaultPL(c).PL;
        updateResultPreview();
      }
      return;
    }
    if (el.dataset.cal === 'month') { ui.month = el.value; ui.selectedDay = null; renderCalendar(); return; }
    if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; renderCalendar(); return; }
    if (el.dataset.ctx) {
      const k = el.dataset.ctx, c = ui.sim.ctx;
      if (k === 'courseId') { setCtxFromCourse(el.value); renderWhatIfForm(); }
      else if (k === 'niveau') { c.niveau = el.value; c.PL = E.clampPL(c.PL, c.niveau); renderWhatIfForm(); }
      else if (k === 'target') { c.target = el.value; renderWhatIfForm(); }
      else if (k === 'date') { if (el.value) { c.date = el.value; renderWhatIfOut(); } }
      return;
    }
    if (el.dataset.sim) {
      const k = el.dataset.sim;
      if (k === 'athlete') { ui.sim.athleteId = el.value; renderSim(); }
      else if (k === 'genre') { const a = athlete(); a.genre = el.value; save.athletes(); renderSim(); }
      else if (k === 'refDate' && el.value) { ui.sim.refDate = el.value; ui.sim.expTarget = null; renderSim(); }
      else if (k === 'expTarget' && el.value) { ui.sim.expTarget = el.value; renderExpiry(); }
      return;
    }
    if (el.dataset.th) {
      const [d, k] = el.dataset.th.split('.');
      const raw = el.value.trim();
      state.settings.thresholds[d][k] = raw === '' ? null : Math.max(0, Number(raw));
      save.settings(); return;
    }
    if (el.dataset.setting === 'padToThree') { state.settings.padToThree = el.checked; save.settings(); return; }
    if (el.id === 'importFile' && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => { importJSON(String(reader.result)); el.value = ''; };
      reader.readAsText(el.files[0]);
    }
  });

  /* ---------- Démarrage ---------- */
  document.documentElement.lang = 'fr';
  applyTheme();
  renderCalendar();

  // API minimale pour l'intégration / le débogage.
  globalThis.WSPLModule = { state, ui, allEvents, renderAll, showTab };
})();
</script>
