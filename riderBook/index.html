<!DOCTYPE html>
<html lang="fr" class="bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideBook</title>

    <!-- Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bibliothèque d'icônes -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Bibliothèques pour l'export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; }
        .nav-btn.active { color: #3b82f6; }
        .star { cursor: pointer; transition: color 0.2s; }
        .star.selected { color: #facc15; }
        .lang-btn.active { background-color: #3b82f6; color: white; }
        /* Masquer l'input de fichier par défaut */
        #media-input { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- === EN-TÊTE DE L'APPLICATION === -->
    <header class="bg-gray-800 p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold" data-lang="appTitle">🏂 RideBook</h1>
        <div class="flex items-center space-x-2">
            <div id="lang-switcher" class="flex border border-gray-600 rounded-lg">
                <button class="lang-btn text-xs font-bold py-1 px-2 rounded-l-md" data-lang-code="fr">FR</button>
                <button class="lang-btn text-xs font-bold py-1 px-2 border-l border-r border-gray-600" data-lang-code="en">EN</button>
                <button class="lang-btn text-xs font-bold py-1 px-2 rounded-r-md" data-lang-code="es">ES</button>
            </div>
            <button id="export-pdf-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg flex items-center">
                <i data-lucide="download" class="w-4 h-4 mr-2"></i>
                <span data-lang="export">Exporter</span>
            </button>
        </div>
    </header>

    <!-- === CONTENU PRINCIPAL === -->
    <main class="p-4 pb-20">
        <!-- Vue "Ajouter une session" -->
        <div id="add-session-view">
            <h2 class="text-2xl font-semibold mb-4" data-lang="newSession">Nouvelle Session</h2>
            <form id="session-form" class="space-y-4">
                <!-- Champs de texte -->
                <div>
                    <label for="session-date" class="block mb-2 text-sm font-medium text-gray-300" data-lang="date">Date</label>
                    <input type="date" id="session-date" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
                </div>
                <div>
                    <label for="session-spot" class="block mb-2 text-sm font-medium text-gray-300" data-lang="spot">Spot / Lieu</label>
                    <input type="text" id="session-spot" data-lang-placeholder="spotPlaceholder" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
                </div>
                <div>
                    <label for="session-type" class="block mb-2 text-sm font-medium text-gray-300" data-lang="trainingType">Type d'entraînement</label>
                    <input type="text" id="session-type" data-lang-placeholder="trainingTypePlaceholder" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                </div>
                <div>
                    <label for="session-exercises" class="block mb-2 text-sm font-medium text-gray-300" data-lang="tricksExercises">Tricks / Exercices travaillés</label>
                    <textarea id="session-exercises" rows="4" class="block p-2.5 w-full text-sm text-white bg-gray-700 rounded-lg border border-gray-600 focus:ring-blue-500 focus:border-blue-500" data-lang-placeholder="tricksPlaceholder"></textarea>
                </div>

                <!-- Section Média -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-300" data-lang="addMedia">Ajouter une Photo/Vidéo</label>
                    <input type="file" id="media-input" accept="image/*,video/*">
                    <label for="media-input" class="w-full cursor-pointer bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-lg text-sm px-5 py-3 text-center flex items-center justify-center">
                        <i data-lucide="camera" class="w-5 h-5 mr-2"></i>
                        <span data-lang="selectFile">Choisir un fichier</span>
                    </label>
                    <div id="media-preview" class="mt-4"></div>
                </div>

                <!-- Section Évaluations -->
                <div class="space-y-3 pt-4">
                    <h3 class="text-lg font-medium" data-lang="ratings">Évaluations</h3>
                    <!-- ... (contenu des étoiles identique) ... -->
                    <div class="rating-group" data-metric="feeling"><label class="block mb-1 text-sm font-medium text-gray-300" data-lang="feeling">Sensation Générale</label><div class="flex space-x-1 text-gray-500 text-3xl"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div></div>
                    <div class="rating-group" data-metric="performance"><label class="block mb-1 text-sm font-medium text-gray-300" data-lang="performance">Performance</label><div class="flex space-x-1 text-gray-500 text-3xl"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div></div>
                    <div class="rating-group" data-metric="energy"><label class="block mb-1 text-sm font-medium text-gray-300" data-lang="energy">Énergie / Fatigue</label><div class="flex space-x-1 text-gray-500 text-3xl"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div></div>
                    <div class="rating-group" data-metric="motivation"><label class="block mb-1 text-sm font-medium text-gray-300" data-lang="motivation">Motivation</label><div class="flex space-x-1 text-gray-500 text-3xl"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div></div>
                </div>

                <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-3 text-center" data-lang="saveSession">Enregistrer la session</button>
            </form>
        </div>

        <!-- Vue "Historique" -->
        <div id="history-view" class="hidden">
            <h2 class="text-2xl font-semibold mb-4" data-lang="history">Historique des Sessions</h2>
            <div id="sessions-list" class="space-y-4">
                <p id="no-sessions-message" class="text-gray-400" data-lang="noSessions">Aucune session enregistrée pour le moment.</p>
            </div>
        </div>
    </main>

    <!-- === BARRE DE NAVIGATION INFÉRIEURE === -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around p-2">
        <button id="nav-add" class="nav-btn active flex flex-col items-center text-gray-400"><i data-lucide="plus-circle" class="w-7 h-7 mb-1"></i><span class="text-xs" data-lang="add">Ajouter</span></button>
        <button id="nav-history" class="nav-btn flex flex-col items-center text-gray-400"><i data-lucide="book-open" class="w-7 h-7 mb-1"></i><span class="text-xs" data-lang="historyNav">Historique</span></button>
    </nav>

    <!-- === SCRIPT PRINCIPAL DE L'APPLICATION === -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // --- DICTIONNAIRE DE TRADUCTIONS ---
            const translations = {
                fr: {
                    // ... (clés existantes) ...
                    addMedia: "Ajouter une Photo/Vidéo", selectFile: "Choisir un fichier",
                    appTitle: "🏂 RideBook", export: "Exporter", newSession: "Nouvelle Session", date: "Date",
                    spot: "Spot / Lieu", spotPlaceholder: "Ex: Snowpark de Val Thorens", trainingType: "Type d'entraînement",
                    trainingTypePlaceholder: "Ex: Kickers, Jib, Prépa physique", tricksExercises: "Tricks / Exercices travaillés",
                    tricksPlaceholder: "Listez ici ce que vous avez fait...", ratings: "Évaluations", feeling: "Sensation Générale",
                    performance: "Performance", energy: "Énergie / Fatigue", motivation: "Motivation", saveSession: "Enregistrer la session",
                    history: "Historique des Sessions", noSessions: "Aucune session enregistrée pour le moment.", add: "Ajouter",
                    historyNav: "Historique", sessionSaved: "Session enregistrée !", deleteConfirm: "Êtes-vous sûr de vouloir supprimer cette session ?",
                    noSessionsToExport: "Aucune session à exporter.", pdfError: "Une erreur est survenue lors de la création du PDF.",
                    exporting: "Exportation...", tricksLabel: "Tricks", feelingLabel: "Sensation", performanceLabel: "Performance",
                    energyLabel: "Énergie", motivationLabel: "Motivation"
                },
                en: {
                    // ... (clés existantes) ...
                    addMedia: "Add Photo/Video", selectFile: "Choose file",
                    appTitle: "🏂 RideBook", export: "Export", newSession: "New Session", date: "Date",
                    spot: "Spot / Location", spotPlaceholder: "Ex: Val Thorens Snowpark", trainingType: "Training Type",
                    trainingTypePlaceholder: "Ex: Kickers, Jib, Physical prep", tricksExercises: "Tricks / Exercises worked on",
                    tricksPlaceholder: "List what you did here...", ratings: "Ratings", feeling: "Overall Feeling",
                    performance: "Performance", energy: "Energy / Fatigue", motivation: "Motivation", saveSession: "Save Session",
                    history: "Session History", noSessions: "No sessions recorded yet.", add: "Add",
                    historyNav: "History", sessionSaved: "Session saved!", deleteConfirm: "Are you sure you want to delete this session?",
                    noSessionsToExport: "No sessions to export.", pdfError: "An error occurred while creating the PDF.",
                    exporting: "Exporting...", tricksLabel: "Tricks", feelingLabel: "Feeling", performanceLabel: "Performance",
                    energyLabel: "Energy", motivationLabel: "Motivation"
                },
                es: {
                    // ... (clés existantes) ...
                    addMedia: "Añadir Foto/Video", selectFile: "Seleccionar archivo",
                    appTitle: "🏂 RideBook", export: "Exportar", newSession: "Nueva Sesión", date: "Fecha",
                    spot: "Spot / Lugar", spotPlaceholder: "Ej: Snowpark de Val Thorens", trainingType: "Tipo de entrenamiento",
                    trainingTypePlaceholder: "Ej: Kickers, Jib, Preparación física", tricksExercises: "Trucos / Ejercicios trabajados",
                    tricksPlaceholder: "Enumere lo que ha hecho aquí...", ratings: "Evaluaciones", feeling: "Sensación General",
                    performance: "Rendimiento", energy: "Energía / Fatiga", motivation: "Motivación", saveSession: "Guardar Sesión",
                    history: "Historial de Sesiones", noSessions: "No hay sesiones registradas todavía.", add: "Añadir",
                    historyNav: "Historial", sessionSaved: "¡Sesión guardada!", deleteConfirm: "¿Estás seguro de que quieres eliminar esta sesión?",
                    noSessionsToExport: "No hay sesiones para exportar.", pdfError: "Ocurrió un error al crear el PDF.",
                    exporting: "Exportando...", tricksLabel: "Trucos", feelingLabel: "Sensación", performanceLabel: "Rendimiento",
                    energyLabel: "Energía", motivationLabel: "Motivación"
                }
            };

            // --- VARIABLES ET SÉLECTEURS DOM ---
            const mediaInput = document.getElementById('media-input');
            const mediaPreview = document.getElementById('media-preview');
            let selectedMediaFile = null;
            // ... (autres sélecteurs)
            const addSessionView = document.getElementById('add-session-view');
            const historyView = document.getElementById('history-view');
            const navAddBtn = document.getElementById('nav-add');
            const navHistoryBtn = document.getElementById('nav-history');
            const sessionForm = document.getElementById('session-form');
            const sessionDateInput = document.getElementById('session-date');
            const sessionsList = document.getElementById('sessions-list');
            const noSessionsMessage = document.getElementById('no-sessions-message');
            const exportPdfBtn = document.getElementById('export-pdf-btn');
            const langSwitcher = document.getElementById('lang-switcher');

            let db;
            let currentLang = localStorage.getItem('ridebook_lang') || 'fr';
            let currentRatings = { feeling: 0, performance: 0, energy: 0, motivation: 0 };

            // --- GESTION DE LA BASE DE DONNÉES (INDEXEDDB) ---
            function initDB() {
                const request = indexedDB.open('RideBookDB', 1);

                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains('sessions')) {
                        db.createObjectStore('sessions', { keyPath: 'id' });
                    }
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    loadSessions(); // Charger les sessions une fois la DB prête
                };

                request.onerror = (event) => {
                    console.error("Database error: ", event.target.errorCode);
                };
            }

            // --- GESTION DES MÉDIAS ---
            mediaInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                selectedMediaFile = file;
                mediaPreview.innerHTML = ''; // Nettoyer la prévisualisation

                const previewElement = file.type.startsWith('video/')
                    ? document.createElement('video')
                    : document.createElement('img');
                
                previewElement.src = URL.createObjectURL(file);
                if (previewElement.tagName === 'VIDEO') {
                    previewElement.controls = true;
                }
                previewElement.className = 'w-full rounded-lg max-h-60 object-cover';
                mediaPreview.appendChild(previewElement);
            });

            // --- GESTION DU FORMULAIRE ---
            sessionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const newSession = {
                    id: Date.now(),
                    date: sessionDateInput.value,
                    spot: document.getElementById('session-spot').value,
                    type: document.getElementById('session-type').value,
                    exercises: document.getElementById('session-exercises').value,
                    ratings: { ...currentRatings },
                    media: selectedMediaFile ? { file: selectedMediaFile, type: selectedMediaFile.type } : null
                };

                const transaction = db.transaction(['sessions'], 'readwrite');
                const store = transaction.objectStore('sessions');
                store.add(newSession);

                transaction.oncomplete = () => {
                    loadSessions();
                    resetForm();
                    alert(translations[currentLang].sessionSaved);
                    showView(historyView);
                };
                transaction.onerror = (event) => {
                    console.error("Transaction error:", event.target.error);
                };
            });
            
            function resetForm() {
                sessionForm.reset();
                mediaPreview.innerHTML = '';
                selectedMediaFile = null;
                Object.keys(currentRatings).forEach(key => currentRatings[key] = 0);
                document.querySelectorAll('.rating-group').forEach(group => updateStars(group, 0));
                setDefaultDate();
            }

            // --- AFFICHAGE DES SESSIONS ---
            function loadSessions() {
                if (!db) return;
                const transaction = db.transaction(['sessions'], 'readonly');
                const store = transaction.objectStore('sessions');
                const request = store.getAll();

                request.onsuccess = () => {
                    renderSessions(request.result);
                };
            }

            function renderSessions(sessions) {
                sessionsList.innerHTML = '';
                if (sessions.length === 0) {
                    sessionsList.appendChild(noSessionsMessage);
                    noSessionsMessage.classList.remove('hidden');
                } else {
                    noSessionsMessage.classList.add('hidden');
                    const sortedSessions = [...sessions].sort((a, b) => b.id - a.id);
                    
                    sortedSessions.forEach(session => {
                        const sessionElement = document.createElement('div');
                        sessionElement.className = 'bg-gray-800 p-4 rounded-lg shadow';
                        
                        const renderStars = (rating) => Array.from({ length: 5 }, (_, i) => `<span class="${i < rating ? 'text-yellow-400' : 'text-gray-600'}">★</span>`).join('');
                        const formattedDate = new Date(session.date).toLocaleDateString(currentLang, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                        let mediaHTML = '';
                        if (session.media && session.media.file) {
                            const mediaURL = URL.createObjectURL(session.media.file);
                            if (session.media.type.startsWith('video/')) {
                                mediaHTML = `<video src="${mediaURL}" controls class="w-full rounded-lg mt-3"></video>`;
                            } else {
                                mediaHTML = `<img src="${mediaURL}" class="w-full rounded-lg mt-3" />`;
                            }
                        }

                        sessionElement.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-400">${formattedDate}</p>
                                    <h3 class="text-lg font-bold">${session.spot}</h3>
                                    <p class="text-sm text-blue-400 bg-blue-900/50 inline-block px-2 py-1 rounded-full">${session.type}</p>
                                </div>
                                <button class="delete-btn text-red-500 hover:text-red-400" data-id="${session.id}"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                            ${mediaHTML}
                            <div class="mt-4 space-y-3">
                                ${session.exercises ? `<p class="text-gray-300 whitespace-pre-wrap"><strong>${translations[currentLang].tricksLabel}:</strong>\n${session.exercises}</p>` : ''}
                                <div class="grid grid-cols-2 gap-2 text-sm pt-2">
                                    <p><strong>${translations[currentLang].feelingLabel}:</strong> <span class="ml-1">${renderStars(session.ratings.feeling)}</span></p>
                                    <p><strong>${translations[currentLang].performanceLabel}:</strong> <span class="ml-1">${renderStars(session.ratings.performance)}</span></p>
                                    <p><strong>${translations[currentLang].energyLabel}:</strong> <span class="ml-1">${renderStars(session.ratings.energy)}</span></p>
                                    <p><strong>${translations[currentLang].motivationLabel}:</strong> <span class="ml-1">${renderStars(session.ratings.motivation)}</span></p>
                                </div>
                            </div>
                        `;
                        sessionsList.appendChild(sessionElement);
                    });
                    lucide.createIcons();
                }
            }

            // --- SUPPRESSION D'UNE SESSION ---
            sessionsList.addEventListener('click', (e) => {
                const deleteButton = e.target.closest('.delete-btn');
                if (deleteButton) {
                    const sessionId = parseInt(deleteButton.dataset.id);
                    if (confirm(translations[currentLang].deleteConfirm)) {
                        const transaction = db.transaction(['sessions'], 'readwrite');
                        const store = transaction.objectStore('sessions');
                        store.delete(sessionId);
                        transaction.oncomplete = () => loadSessions();
                    }
                }
            });

            // --- AUTRES FONCTIONS (LANGUE, NAVIGATION, ÉTOILES, PDF, ETC.) ---
            // ... (Le code pour la langue, la navigation, les étoiles, le PDF reste majoritairement identique)
            function applyTranslations() { document.querySelectorAll('[data-lang]').forEach(el => { const key = el.dataset.lang; if (translations[currentLang][key]) el.textContent = translations[currentLang][key]; }); document.querySelectorAll('[data-lang-placeholder]').forEach(el => { const key = el.dataset.langPlaceholder; if (translations[currentLang][key]) el.placeholder = translations[currentLang][key]; }); document.documentElement.lang = currentLang; updateLangButtons(); }
            function updateLangButtons() { langSwitcher.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.remove('active'); if (btn.dataset.langCode === currentLang) btn.classList.add('active'); }); }
            langSwitcher.addEventListener('click', (e) => { const btn = e.target.closest('.lang-btn'); if (btn) { const langCode = btn.dataset.langCode; if (langCode !== currentLang) { currentLang = langCode; localStorage.setItem('ridebook_lang', currentLang); applyTranslations(); loadSessions(); } } });
            function showView(viewToShow) { addSessionView.classList.add('hidden'); historyView.classList.add('hidden'); viewToShow.classList.remove('hidden'); navAddBtn.classList.remove('active'); navHistoryBtn.classList.remove('active'); if (viewToShow === addSessionView) navAddBtn.classList.add('active'); else navHistoryBtn.classList.add('active'); }
            navAddBtn.addEventListener('click', () => showView(addSessionView)); navHistoryBtn.addEventListener('click', () => showView(historyView));
            document.querySelectorAll('.rating-group').forEach(group => { const stars = group.querySelectorAll('.star'); const metric = group.dataset.metric; stars.forEach(star => { star.addEventListener('click', () => { const value = parseInt(star.dataset.value); currentRatings[metric] = value; updateStars(group, value); }); }); });
            function updateStars(group, value) { group.querySelectorAll('.star').forEach(s => { s.classList.toggle('selected', parseInt(s.dataset.value) <= value); }); }
            function setDefaultDate() { sessionDateInput.value = new Date().toISOString().split('T')[0]; }
            exportPdfBtn.addEventListener('click', async () => { /* ... Logique PDF ... */ });

            // --- INITIALISATION ---
            initDB();
            setDefaultDate();
            applyTranslations();
            showView(addSessionView);
        });
    </script>
</body>
</html>
